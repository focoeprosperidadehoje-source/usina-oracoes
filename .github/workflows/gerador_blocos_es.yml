name: 🎙️ Gerador de Áudio Live ES

on:
  schedule:
    - cron: '0 6,12,18 * * *'   # 3×/dia: 6h, 12h, 18h UTC
  workflow_dispatch:              # disparo manual

jobs:
  gerar_audio:
    name: Gerar áudio (roteiro → TTS) → rsync VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar dependências Python
        run: |
          pip install --quiet \
            google-genai \
            google-api-python-client \
            google-auth \
            edge-tts \
            pytz

      - name: Gerar áudio (roteiro → TTS)
        env:
          GEMINI_KEY_LIVE_CONTENT_1: ${{ secrets.GEMINI_KEY_LIVE_CONTENT_1 }}
          GEMINI_KEY_LIVE_CONTENT_2: ${{ secrets.GEMINI_KEY_LIVE_CONTENT_2 }}
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CREDENTIALS_ES:     ${{ secrets.GOOGLE_CREDENTIALS }}
          YOUTUBE_TOKEN_ES:          ${{ secrets.YOUTUBE_TOKEN_ES }}
        run: python3 ao_vivo/gerar_bloco_live.py

      - name: Listar blocos gerados
        run: |
          echo "Blocos prontos para envio:"
          ls -lh blocos/

      - name: Configurar SSH para VPS
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_VPS_ES }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 80.241.213.27 >> ~/.ssh/known_hosts 2>/dev/null
          echo "=== Diagnóstico SSH key ==="
          head -1 ~/.ssh/vps_key
          wc -l ~/.ssh/vps_key
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            root@80.241.213.27 "echo SSH_TEST_OK && hostname" || true

      - name: Enviar blocos para VPS via rsync
        run: |
          rsync -avz --progress \
            -e "ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no" \
            blocos/ \
            root@80.241.213.27:/root/ao_vivo_es/blocos/

      - name: Remover chave SSH temporária
        if: always()
        run: rm -f ~/.ssh/vps_key
