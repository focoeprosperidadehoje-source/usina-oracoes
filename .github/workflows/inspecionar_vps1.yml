name: Inspecionar VPS1 (ES+PT)
on:
  workflow_dispatch:
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_VPS_ES }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 80.241.213.27 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspecionar ES e PT
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@80.241.213.27 bash << 'ENDSSH'
          echo "========== ES BLOCOS =========="
          ls -lht /root/ao_vivo_es/blocos/bloco_*_h.mp4 2>/dev/null | head -15 || echo "(nenhum)"
          echo ""
          echo "=== ES VIDEOS_BASE ==="
          ls /root/ao_vivo_es/videos_base/*.mp4 2>/dev/null | wc -l | xargs echo "count:"
          ls /root/ao_vivo_es/videos_base/*.mp4 2>/dev/null | head -5 || echo "(nenhum)"
          echo ""
          echo "=== ES BLOCO MAIS NOVO — bitrate ==="
          NEWEST=$(ls -t /root/ao_vivo_es/blocos/bloco_*_h.mp4 2>/dev/null | head -1)
          if [ -n "$NEWEST" ]; then
            echo "arquivo: $NEWEST"
            ffprobe -v quiet -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 "$NEWEST" | xargs echo "bitrate bps:"
          else
            echo "sem blocos"
          fi
          echo ""
          echo "========== PT BLOCOS =========="
          ls -lht /root/ao_vivo_pt/blocos/bloco_*_h.mp4 2>/dev/null | head -15 || echo "(nenhum)"
          echo ""
          echo "=== PT VIDEOS_BASE ==="
          ls /root/ao_vivo_pt/videos_base/*.mp4 2>/dev/null | wc -l | xargs echo "count:"
          ls /root/ao_vivo_pt/videos_base/*.mp4 2>/dev/null | head -5 || echo "(nenhum)"
          echo ""
          echo "=== PT BLOCO MAIS NOVO — bitrate ==="
          NEWEST=$(ls -t /root/ao_vivo_pt/blocos/bloco_*_h.mp4 2>/dev/null | head -1)
          if [ -n "$NEWEST" ]; then
            echo "arquivo: $NEWEST"
            ffprobe -v quiet -select_streams v:0 -show_entries stream=bit_rate -of csv=p=0 "$NEWEST" | xargs echo "bitrate bps:"
          else
            echo "sem blocos"
          fi
          echo ""
          echo "=== PT — verificar voz nos blocos (audio stream info) ==="
          NEWEST=$(ls -t /root/ao_vivo_pt/blocos/bloco_*_h.mp4 2>/dev/null | head -1)
          [ -n "$NEWEST" ] && ffprobe -v quiet -show_entries format_tags=title -of csv=p=0 "$NEWEST" || echo "sem bloco"
          echo ""
          echo "=== CONTAGEM TOTAL ==="
          echo "ES blocos H: $(ls /root/ao_vivo_es/blocos/bloco_*_h.mp4 2>/dev/null | wc -l)"
          echo "PT blocos H: $(ls /root/ao_vivo_pt/blocos/bloco_*_h.mp4 2>/dev/null | wc -l)"
          echo "ES audio pendente: $(ls /root/ao_vivo_es/blocos/audio_*.mp3 2>/dev/null | wc -l)"
          echo "PT audio pendente: $(ls /root/ao_vivo_pt/blocos/audio_*.mp3 2>/dev/null | wc -l)"
          ENDSSH

      - name: Limpar chave
        if: always()
        run: rm -f ~/.ssh/vps_key
