name: Limpar blocos obsoletos VPS1 (ES+PT)
on:
  workflow_dispatch:
jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_VPS_ES }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 80.241.213.27 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Limpar ES e PT
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@80.241.213.27 bash << 'ENDSSH'
          echo "=== ANTES DA LIMPEZA ==="
          echo "ES blocos H: $(ls /root/ao_vivo_es/blocos/bloco_*_h.mp4 2>/dev/null | wc -l)"
          echo "PT blocos H: $(ls /root/ao_vivo_pt/blocos/bloco_*_h.mp4 2>/dev/null | wc -l)"

          echo ""
          echo "=== REMOVENDO blocos ES possivelmente pre-Guadalupe (assemblados Aug 20) ==="
          rm -fv /root/ao_vivo_es/blocos/bloco_20260820_0641_02_h.mp4
          rm -fv /root/ao_vivo_es/blocos/bloco_20260820_1234_04_h.mp4
          rm -fv /root/ao_vivo_es/blocos/bloco_20260820_0040_03_h.mp4
          rm -fv /root/ao_vivo_es/blocos/bloco_20260820_0040_04_h.mp4
          rm -fv /root/ao_vivo_es/blocos/bloco_20260820_0641_03_h.mp4

          echo ""
          echo "=== REMOVENDO blocos PT com voz FranciscaNeural (antiga) ==="
          rm -fv /root/ao_vivo_pt/blocos/bloco_20260821_0433_02_h.mp4
          rm -fv /root/ao_vivo_pt/blocos/bloco_20260821_0433_03_h.mp4
          rm -fv /root/ao_vivo_pt/blocos/bloco_20260821_0433_04_h.mp4
          rm -fv /root/ao_vivo_pt/blocos/bloco_20260821_1036_01_h.mp4
          rm -fv /root/ao_vivo_pt/blocos/bloco_20260821_1036_03_h.mp4
          rm -fv /root/ao_vivo_pt/blocos/bloco_20260821_1036_04_h.mp4
          rm -fv /root/ao_vivo_pt/blocos/bloco_20260822_2310_01_h.mp4
          rm -fv /root/ao_vivo_pt/blocos/bloco_20260822_2310_02_h.mp4
          rm -fv /root/ao_vivo_pt/blocos/bloco_20260822_2310_03_h.mp4

          echo ""
          echo "=== APOS LIMPEZA ==="
          echo "ES blocos H: $(ls /root/ao_vivo_es/blocos/bloco_*_h.mp4 2>/dev/null | wc -l)"
          ls -lh /root/ao_vivo_es/blocos/bloco_*_h.mp4 2>/dev/null
          echo ""
          echo "PT blocos H: $(ls /root/ao_vivo_pt/blocos/bloco_*_h.mp4 2>/dev/null | wc -l)"
          ls -lh /root/ao_vivo_pt/blocos/bloco_*_h.mp4 2>/dev/null
          echo ""
          echo "ES audio pendente: $(ls /root/ao_vivo_es/blocos/audio_*.mp3 2>/dev/null | wc -l)"
          echo "PT audio pendente: $(ls /root/ao_vivo_pt/blocos/audio_*.mp3 2>/dev/null | wc -l)"
          ENDSSH

      - name: Limpar chave
        if: always()
        run: rm -f ~/.ssh/vps_key
