name: Deploy ao_vivo.py + Pillow → VPS

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'deploy = atualizar ao_vivo.py | log = ler log | disable_v = comentar STREAM_KEY_V no .env | status = status + log recente'
        required: false
        default: 'deploy'

jobs:
  deploy:
    name: SCP ao_vivo.py + pip install Pillow + restart
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH para VPS
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_VPS_ES }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 80.241.213.27 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ler log (modo=log)
        if: ${{ github.event.inputs.modo == 'log' }}
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@80.241.213.27 "
            echo '=== 02:xx UTC (restart) ===';
            grep '2026-08-06 02' /root/ao_vivo_es/ao_vivo.log | tail -30;
            echo '=== 03:xx UTC ===';
            grep '2026-08-06 03' /root/ao_vivo_es/ao_vivo.log | head -20;
            echo '=== thumbnail em todo o log ===';
            grep -i 'thumbnail' /root/ao_vivo_es/ao_vivo.log | tail -20;
            echo '=== PUBLICO em todo o log ===';
            grep 'PÚBLICO\|publico\|PUBLIC' /root/ao_vivo_es/ao_vivo.log | tail -10;
          "

      - name: Enviar ao_vivo.py para VPS
        if: ${{ github.event.inputs.modo != 'log' }}
        run: |
          scp -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            ao_vivo/ao_vivo.py \
            root@80.241.213.27:/root/ao_vivo_es/ao_vivo.py

      - name: Instalar Pillow + reiniciar serviço
        if: ${{ github.event.inputs.modo != 'log' }}
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@80.241.213.27 \
            "apt-get install -y python3-pil --no-install-recommends -qq 2>&1 | tail -3 && \
             systemctl restart ao_vivo_es && \
             sleep 5 && \
             systemctl is-active ao_vivo_es && \
             echo DEPLOY_OK"

      - name: Desabilitar live vertical (modo=disable_v)
        if: ${{ github.event.inputs.modo == 'disable_v' }}
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@80.241.213.27 "
            sed -i 's/^STREAM_KEY_V=/#STREAM_KEY_V=/' /root/ao_vivo_es/.env
            echo '--- .env STREAM_KEY_V ---'
            grep 'STREAM_KEY_V' /root/ao_vivo_es/.env
            systemctl restart ao_vivo_es
            sleep 5
            systemctl is-active ao_vivo_es
            echo DISABLE_V_OK
          "

      - name: Status + log recente (modo=status)
        if: ${{ github.event.inputs.modo == 'status' }}
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@80.241.213.27 "
            systemctl status ao_vivo_es --no-pager -l | tail -20
            echo '--- LOG RECENTE ---'
            tail -50 /root/ao_vivo_es/ao_vivo.log
          "

      - name: Remover chave SSH temporária
        if: always()
        run: rm -f ~/.ssh/vps_key
