name: Rotacionar Título Live ES

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  rotacionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências
        run: pip install google-api-python-client google-auth google-auth-httplib2 pytz --quiet

      - name: Rotacionar título
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_ES }}
          TZ_NAME: America/Mexico_City
          TITULOS_JSON: >-
            {"manha":"La Morenita Sana Tu Cuerpo AHORA — Oración en Vivo 24H 🙏","tarde":"La Morenita Restaura Tu Familia HOY — En Vivo 24H 🙏","noite":"La Morenita Te Protege AHORA de Todo Mal — En Vivo 24H 🙏","madrugada":"La Morenita Rompe AHORA Toda Atadura — Oración en Vivo 24H 🙏"}
        run: python3 scripts/rotacionar_titulo_live.py
