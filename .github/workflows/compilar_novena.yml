name: Compilar Novenas Completas

on:
  schedule:
    - cron: '30 10 * * 2'  # Terça 10:30 UTC = 07:30 BRT
    - cron: '30 10 * * 5'  # Sexta  10:30 UTC = 07:30 BRT
  workflow_dispatch:
    inputs:
      canal:
        description: 'Canal (ES)'
        required: true
        default: 'ES'
        type: choice
        options:
          - ES

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_ES }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      CANAL: ES
    steps:
      - uses: actions/checkout@v4

      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/ffmpeg
          key: ffmpeg-static-linux64-n7

      - name: Instalar FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          wget -q -O /tmp/ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          tar -xf /tmp/ffmpeg.tar.xz --strip-components=2 -C /tmp --wildcards '*/bin/ffmpeg'
          sudo mv /tmp/ffmpeg /usr/local/bin/ffmpeg
          sudo chmod +x /usr/local/bin/ffmpeg

      - name: Instalar yt-dlp
        run: pip install --quiet yt-dlp

      - name: Instalar dependências Python
        run: |
          pip install --quiet \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth-httplib2 \
            gspread \
            pytz

      - name: Verificar espaço em disco
        run: df -h /tmp

      - name: Compilar novenas
        run: python compilar_novena.py
