name: Gerar Vídeo Ambiente Noturno

on:
  schedule:
    - cron: '0 10 * * 1'  # Segunda 10:00 UTC = 07:00 BRT
    - cron: '0 10 * * 4'  # Quinta  10:00 UTC = 07:00 BRT
  workflow_dispatch:
    inputs:
      canal:
        description: 'Canal (ES ou PT)'
        required: true
        default: 'ES'
        type: choice
        options:
          - ES
          - PT

jobs:
  gerar-es:
    if: github.event_name == 'schedule' || github.event.inputs.canal == 'ES'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_ES }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      CANAL: ES
    steps:
      - uses: actions/checkout@v4

      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ffmpeg
          key: ffmpeg-static-linux64-n7

      - name: Instalar FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2024-03-31-12-50/ffmpeg-n7.0-latest-linux64-gpl-7.0.tar.xz" -O ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          mkdir -p ffmpeg
          cp ffmpeg-n7.0-latest-linux64-gpl-7.0/bin/ffmpeg ffmpeg/
          rm -rf ffmpeg.tar.xz ffmpeg-n7.0-latest-linux64-gpl-7.0

      - name: Adicionar FFmpeg ao PATH
        run: echo "${{ github.workspace }}/ffmpeg" >> $GITHUB_PATH

      - name: Baixar fonte Anton
        run: wget -q -O Anton.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf

      - name: Instalar dependências Python
        run: |
          pip install --quiet \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth-httplib2 \
            Pillow \
            gspread \
            pytz

      - name: Gerar vídeos ambiente (ES)
        run: python gerar_video_ambiente.py

  gerar-pt:
    if: github.event.inputs.canal == 'PT'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_PT }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      CANAL: PT
    steps:
      - uses: actions/checkout@v4

      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ffmpeg
          key: ffmpeg-static-linux64-n7

      - name: Instalar FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2024-03-31-12-50/ffmpeg-n7.0-latest-linux64-gpl-7.0.tar.xz" -O ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          mkdir -p ffmpeg
          cp ffmpeg-n7.0-latest-linux64-gpl-7.0/bin/ffmpeg ffmpeg/
          rm -rf ffmpeg.tar.xz ffmpeg-n7.0-latest-linux64-gpl-7.0

      - name: Adicionar FFmpeg ao PATH
        run: echo "${{ github.workspace }}/ffmpeg" >> $GITHUB_PATH

      - name: Baixar fonte Anton
        run: wget -q -O Anton.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf

      - name: Instalar dependências Python
        run: |
          pip install --quiet \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth-httplib2 \
            Pillow \
            gspread \
            pytz

      - name: Gerar vídeos ambiente (PT)
        run: python gerar_video_ambiente.py
