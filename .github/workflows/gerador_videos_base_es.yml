name: 🖼️ Gerador de Vídeos Base (ES / PT)

on:
  schedule:
    - cron: '0 3 * * 0'   # Domingos às 3h UTC (meia-noite BRT)
  workflow_dispatch:
    inputs:
      num_videos:
        description: 'Quantos vídeos criar (padrão: 8)'
        required: false
        default: '8'
      drive_folder_id:
        description: 'ID da pasta Drive (vazio = Guadalupe ES padrão)'
        required: false
        default: ''
      video_prefix:
        description: 'Prefixo do arquivo de saída'
        required: false
        default: 'guadalupe'

jobs:
  gerar_videos_base:
    name: Criar slideshow blur-fill → rsync VPS
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/ffmpeg
          key: ffmpeg-static-linux64-n7

      - name: Instalar FFmpeg (static binary)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          wget -q -O /tmp/ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          tar -xf /tmp/ffmpeg.tar.xz --strip-components=2 -C /tmp --wildcards '*/bin/ffmpeg'
          sudo mv /tmp/ffmpeg /usr/local/bin/ffmpeg
          sudo chmod +x /usr/local/bin/ffmpeg

      - name: Instalar dependências Python
        run: |
          pip install --quiet \
            google-api-python-client \
            google-auth \
            pillow

      - name: Gerar vídeos base (blur-fill, santa centralizada)
        env:
          GOOGLE_CREDENTIALS_ES: ${{ secrets.GOOGLE_CREDENTIALS }}
          NUM_VIDEOS:      ${{ github.event.inputs.num_videos    || '8' }}
          VIDEO_PREFIX:    ${{ github.event.inputs.video_prefix  || 'guadalupe' }}
          DRIVE_FOLDER_ID: ${{ github.event.inputs.drive_folder_id || '' }}
        run: python3 ao_vivo/gerar_videos_base.py

      - name: Listar vídeos gerados
        run: |
          echo "Vídeos criados:"
          ls -lh videos_base/ 2>/dev/null || echo "(nenhum)"

      - name: Configurar SSH para VPS
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_VPS_ES }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 80.241.213.27 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Enviar vídeos para VPS (videos_base/)
        run: |
          rsync -avz --progress \
            -e "ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no" \
            videos_base/ \
            root@80.241.213.27:/root/ao_vivo_es/videos_base/

      - name: Limpar chave SSH temporária
        if: always()
        run: rm -f ~/.ssh/vps_key
