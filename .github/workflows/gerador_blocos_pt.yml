name: 🎙️ Gerador de Áudio Live PT

on:
  schedule:
    - cron: '0 5,9,13,17,21,1 * * *'  # 6×/dia: a cada 4h UTC (2h,6h,10h,14h,18h,22h BRT)
  workflow_dispatch:              # disparo manual

jobs:
  gerar_audio:
    name: Gerar áudio PT (roteiro → TTS) → rsync VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências Python
        run: |
          pip install --quiet \
            google-genai \
            google-api-python-client \
            google-auth \
            edge-tts \
            pytz

      - name: Gerar áudio PT (roteiro → TTS)
        env:
          GEMINI_KEY_LIVE_CONTENT_1_PT: ${{ secrets.GEMINI_KEY_LIVE_CONTENT_1_PT }}
          GEMINI_KEY_LIVE_CONTENT_2_PT: ${{ secrets.GEMINI_KEY_LIVE_CONTENT_2_PT }}
          YOUTUBE_TOKEN_PT:             ${{ secrets.YOUTUBE_TOKEN_PT }}
        run: python3 ao_vivo_pt/gerar_bloco_live_pt.py

      - name: Listar blocos PT gerados
        run: |
          echo "Blocos PT prontos para envio:"
          ls -lh blocos_pt/ 2>/dev/null || echo "(nenhum)"

      - name: Configurar SSH para VPS
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_VPS_ES }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 80.241.213.27 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            root@80.241.213.27 "echo SSH_TEST_OK && hostname" || true

      - name: Enviar blocos PT para VPS via rsync
        run: |
          rsync -avz --progress \
            -e "ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no" \
            blocos_pt/ \
            root@80.241.213.27:/root/ao_vivo_pt/blocos/

      - name: Remover chave SSH temporária
        if: always()
        run: rm -f ~/.ssh/vps_key
